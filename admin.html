<!DOCTYPE html>
<html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>KP Sallon — Menaxhimi</title>
<style>
:root{--gold:#d4b87a;--line:rgba(212,184,122,.3)}
*{box-sizing:border-box;margin:0}
body{background:#0b0b0c;color:#f3ede2;font-family:system-ui,sans-serif;padding:24px;max-width:1000px;margin:auto}
h1{font-family:Georgia,serif;font-weight:500;color:var(--gold);margin-bottom:6px}
.muted{color:#9a968e;font-size:.85rem}
input,button{font:inherit}
.btn{background:var(--gold);color:#111;border:0;padding:12px 22px;cursor:pointer;font-weight:600;letter-spacing:.08em}
.box{border:1px dashed var(--gold);padding:34px 20px;text-align:center;margin:22px 0;cursor:pointer}
.box.drag{background:rgba(212,184,122,.12)}
input[type=password],input[type=email],#pw{background:#141416;border:1px solid var(--line);color:#fff;padding:12px;margin:14px 8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.it{position:relative;border:1px solid var(--line);aspect-ratio:1;background:#000;overflow:hidden}
.it img,.it video{width:100%;height:100%;object-fit:cover}
.it button{position:absolute;top:6px;right:6px;background:#c0392b;color:#fff;border:0;padding:6px 10px;cursor:pointer}
.it span{position:absolute;left:6px;bottom:6px;background:#000a;padding:2px 8px;font-size:.7rem}
[hidden]{display:none!important}
</style></head><body>
<h1>KP Sallon — Menaxhimi i galerisë</h1>
<div id="gate"><p class="muted">Hyr me email dhe fjalëkalim.</p><input type="email" id="em" placeholder="Email" autocomplete="username"><input type="password" id="pw" placeholder="Fjalëkalimi" autocomplete="current-password"><button class="btn" id="go">HYR</button><p class="muted" id="err"></p></div>
<div id="app" hidden>
  <p class="muted">Çdo foto ose video e shtuar shfaqet në galerinë e faqes kryesore (5 më të rejat, të tjerat te "Shiko më shumë"). <a href="./" style="color:var(--gold)">Hap faqen →</a></p>
  <div class="box" id="drop" tabindex="0" role="button">＋ Kliko ose tërhiq këtu foto dhe video<input type="file" id="file" accept="image/*,video/*" multiple hidden></div>
  <p class="muted" id="count"></p><div class="grid" id="grid"></div>
</div>
<script>
const SB = { url: "https://cbbticfgwcfrrifolpln.supabase.co", key: "sb_publishable_D9AkinDVIImDGzaTnBULJg_-GBHlKKn" };   // nga Supabase > Project Settings > API
const $ = s => document.querySelector(s);
const EXT = { "image/jpeg": ".jpg", "image/png": ".png", "image/webp": ".webp", "image/gif": ".gif", "video/mp4": ".mp4", "video/webm": ".webm", "video/quicktime": ".mov" };
const tok = () => sessionStorage.getItem("kp_token") || "";
const pub = p => `${SB.url}/storage/v1/object/public/gallery/${p}`;
const logout = () => { sessionStorage.removeItem("kp_token"); $("#app").hidden = true; $("#gate").hidden = false; };
async function sb(path, o = {}) {
  const r = await fetch(SB.url + path, { ...o, headers: { apikey: SB.key, ...(tok() ? { Authorization: "Bearer " + tok() } : {}), ...(o.headers || {}) } });
  if (!r.ok) { if (r.status === 401) logout(); const d = await r.json().catch(() => ({})); throw new Error(d.message || d.msg || d.error || "Gabim"); }
  return r.status === 204 ? null : r.json().catch(() => null);
}
const shrink = f => new Promise(res => { const i = new Image(); i.onload = () => { const k = Math.min(1, 1600 / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = i.width * k; c.height = i.height * k; c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); c.toBlob(res, "image/jpeg", .85); }; i.onerror = () => res(f); i.src = URL.createObjectURL(f); });
async function upload(files) {
  const all = [...files]; let k = 0;
  for (const f of all) {
    k++; $("#count").textContent = `Po ngarkohet ${k} nga ${all.length}...`;
    const v = f.type.startsWith("video/");
    if (!v && !f.type.startsWith("image/")) continue;
    const blob = v || f.type === "image/gif" ? f : await shrink(f), type = blob.type || f.type, ext = EXT[type];
    if (!ext) { alert(f.name + ": format i pambështetur."); continue; }
    const path = crypto.randomUUID() + ext;
    try {
      await sb("/storage/v1/object/gallery/" + path, { method: "POST", headers: { "Content-Type": type }, body: blob });
      try { await sb("/rest/v1/posts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type: v ? "video" : "image", path }) }); }
      catch (e) { await sb("/storage/v1/object/gallery/" + path, { method: "DELETE" }).catch(() => {}); throw e; }
    } catch (e) { alert(f.name + ": " + e.message); }
  }
  draw();
}
async function draw() {
  let items = []; try { items = await sb("/rest/v1/posts?select=*&order=created_at.desc") || []; } catch (e) { $("#count").textContent = "Gabim: " + e.message; return; }
  $("#count").textContent = items.length ? items.length + " postime" : "Ende pa postime.";
  $("#grid").innerHTML = "";
  items.forEach(p => {
    const d = document.createElement("div"); d.className = "it"; const u = pub(p.path);
    d.innerHTML = (p.type === "video" ? `<video src="${u}#t=0.1" muted preload="metadata"></video>` : `<img src="${u}" alt="">`) + `<span>${p.type === "video" ? "VIDEO" : "FOTO"}</span><button type="button">Fshij</button>`;
    d.querySelector("button").onclick = async () => {
      if (!confirm("Ta fshij këtë postim?")) return;
      try { await sb("/rest/v1/posts?id=eq." + p.id, { method: "DELETE" }); await sb("/storage/v1/object/gallery/" + p.path, { method: "DELETE" }).catch(() => {}); draw(); } catch (e) { alert(e.message); }
    };
    $("#grid").appendChild(d);
  });
}
const unlock = () => { $("#gate").hidden = true; $("#app").hidden = false; draw(); };
if (tok()) unlock();
$("#go").onclick = async () => {
  $("#err").textContent = "";
  try {
    const r = await fetch(SB.url + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: SB.key, "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#em").value.trim(), password: $("#pw").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error_code === "email_not_confirmed" ? "Email-i nuk është konfirmuar në Supabase (përdoruesi duhet krijuar me Auto Confirm)." : d.error_code === "invalid_credentials" ? "Email ose fjalëkalim i gabuar." : (d.msg || d.error_description || "Gabim hyrjeje."));
    sessionStorage.setItem("kp_token", d.access_token); $("#pw").value = ""; unlock();
  } catch (e) { $("#err").textContent = e.message === "Load failed" || e.message === "Failed to fetch" ? "Nuk lidhet me Supabase. Hape faqen nga adresa online (jo brenda Claude)." : (e.message || "Gabim lidhjeje."); }
};
$("#pw").onkeydown = e => { if (e.key === "Enter") $("#go").click(); };
const drop = $("#drop");
drop.onclick = () => $("#file").click();
drop.onkeydown = e => { if (e.key === "Enter") $("#file").click(); };
$("#file").onchange = e => { upload(e.target.files); e.target.value = ""; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add("drag"); };
drop.ondragleave = () => drop.classList.remove("drag");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("drag"); upload(e.dataTransfer.files); };
</script></body></html>
